name: slides_sync
description: "A slides management app"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.7.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  custom_widgets_toolkit: ^0.0.76
  iconsax_flutter: ^1.0.0
  flutter_animate: ^4.5.2
  heroine: ^0.4.0
  marquee: ^2.3.0
  wave: ^0.2.2
  lottie: ^3.3.1
  uuid: ^4.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  stacked_card_carousel: ^0.0.4
  go_router: ^15.1.2
  markdown_widget: ^2.3.2+8
  another_flushbar: 1.12.30


  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5

  googleapis: ^14.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.13
  googleapis_auth:
  http: ^1.4.0
  

  # syncfusion_flutter_pdf: ^29.2.4
  # syncfusion_flutter_pdfviewer: ^29.2.4
  open_filex: ^4.7.0
  permission_handler: ^12.0.0+1
  photo_view: ^0.15.0
  archive: ^4.0.7
  flutter_pdfview: ^1.4.0+1
  pdfx: ^2.9.1
  share_plus: ^11.0.0
  image_picker: ^1.1.2
  file_picker: ^10.1.9
  path: ^1.9.1
  cached_network_image: ^3.4.1

  collection: any
  flutter_image_compress: ^2.3.0

  # External Git package
  material_shapes:
    git:
      url: https://github.com/ksokolovskyi/material_shapes.git

      
  intl: any
  crypto: ^3.0.6
  google_fonts: ^6.2.1
  isar: ^3.1.0+1
  skeletonizer: ^2.1.0+1
  cloud_firestore: ^6.0.0
  firebase_auth: ^6.0.1
  firebase_core: ^4.1.0
  firebase_database: ^12.0.0
  firebase_storage: ^13.0.0
  google_sign_in: ^6.3.0
  infinite_scroll_pagination: ^5.1.1
  any_link_preview: ^3.0.3
  flutter_link_previewer: ^3.2.2
  super_clipboard: ^0.9.1
  firebase_ai: ^3.2.0
  syncfusion_flutter_pdf: ^31.1.17
  syncfusion_flutter_pdfviewer: ^31.1.17

  #docx_file_viewer: ^0.0.1

flutter_native_splash:
  android: true
  ios: true

  color: "#FCFAFE"
  image: "assets/logo/logo.png"
  color_dark: "#0B0B10"
  image_dark: "assets/logo/logo.png"

  android_12:
    color: "#FCFAFE"
    image: "assets/logo/logo.png"
    color_dark: "#0B0B10"
    image_dark: "assets/logo/logo.png"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/logo.png"
  android_adaptive_icon:
    background_color: "#5000B8"
    foreground_image: "assets/logo/logo.png"
  remove_alpha_ios: true



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4

  flutter_lints: ^5.0.0
  riverpod_lint: ^2.1.1

  isar_generator: ^3.1.0+1
  build_runner: any



dependency_overrides:




flutter:

  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/icons/animated_jsons/
    - assets/images/
    - assets/logo/

#-FONTS
fonts:
  - family: Nunito
    fonts:
      - asset: assets/fonts/Nunito-Light.ttf
        weight: 300
      - asset: assets/fonts/Nunito-LightItalic.ttf
        weight: 300
        style: italic

      - asset: assets/fonts/Nunito-Regular.ttf
        weight: 400
      - asset: assets/fonts/Nunito-Italic.ttf
        weight: 400
        style: italic

      - asset: assets/fonts/Nunito-Medium.ttf
        weight: 500
      - asset: assets/fonts/Nunito-MediumItalic.ttf
        weight: 500
        style: italic

      - asset: assets/fonts/Nunito-SemiBold.ttf
        weight: 600
      - asset: assets/fonts/Nunito-SemiBoldItalic.ttf
        weight: 600
        style: italic

      - asset: assets/fonts/Nunito-Bold.ttf
        weight: 700
      - asset: assets/fonts/Nunito-BoldItalic.ttf
        weight: 700
        style: italic

      - asset: assets/fonts/Nunito-ExtraBold.ttf
        weight: 800
      - asset: assets/fonts/Nunito-ExtraBoldItalic.ttf
        weight: 800
        style: italic

      - asset: assets/fonts/Nunito-Black.ttf
        weight: 900
      - asset: assets/fonts/Nunito-BlackItalic.ttf
        weight: 900
        style: italic

